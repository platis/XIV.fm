<svg width="297" height="75.2" viewBox="0 0 297 75.2" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible">
  <title>XIV.fm compact listening card at its maximum width</title>
  <desc>The card contracts to its text. The artwork group and its horizontal space are included only when album artwork is available.</desc>
  <defs>
    <filter id="card-shadow" x="-5%" y="-10%" width="110%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="artwork-clip">
      <rect x="10" y="10" width="55.2" height="55.2" rx="3"/>
    </clipPath>
  </defs>
  <rect width="297" height="75.2" rx="5" fill="#2B2B2B" fill-opacity="0.6" filter="url(#card-shadow)"/>
  <rect x="0.5" y="0.5" width="296" height="74.2" rx="4.5" stroke="white" stroke-opacity="0.14"/>
  <path d="M5 1H292" stroke="white" stroke-opacity="0.12" stroke-linecap="round"/>
  <g id="conditional-album-artwork">
    <g clip-path="url(#artwork-clip)">
      <rect x="10" y="10" width="55.2" height="55.2" fill="#343944"/>
      <circle cx="37.6" cy="37.6" r="19.2" fill="#555D6D"/>
      <circle cx="37.6" cy="37.6" r="4.8" fill="#2B2B2B"/>
    </g>
    <rect x="10.5" y="10.5" width="54.2" height="54.2" rx="2.5" stroke="white" stroke-opacity="0.14"/>
  </g>
  <text x="75.2" y="44.6" fill="white" font-family="sans-serif" font-size="21.6" font-weight="700">Long music title...</text>
  <text x="75.2" y="65.2" fill="#B3B5BA" font-family="sans-serif" font-size="19.2">Long artist name...</text>
</svg>

<svg width="293" height="64" viewBox="0 0 293 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XIV.fm compact listening card</title>
  <desc>The artwork group is drawn only when album artwork is available; otherwise its reserved area remains empty.</desc>
  <rect width="293" height="64" rx="5" fill="#111318" fill-opacity="0.82"/>
  <g id="conditional-album-artwork">
    <clipPath id="artwork-clip">
      <rect x="9" y="9" width="46" height="46"/>
    </clipPath>
    <g clip-path="url(#artwork-clip)">
      <rect x="9" y="9" width="46" height="46" fill="#343944"/>
      <circle cx="32" cy="32" r="16" fill="#555D6D"/>
      <circle cx="32" cy="32" r="4" fill="#111318"/>
    </g>
  </g>
  <text x="66" y="34" fill="white" font-family="sans-serif" font-size="18" font-weight="700">Long music title...</text>
  <text x="66" y="55" fill="#A6A8AD" font-family="sans-serif" font-size="16">Long artist name...</text>
</svg>

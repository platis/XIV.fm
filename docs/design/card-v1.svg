<svg width="222" height="58" viewBox="0 0 222 58" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XIV.fm compact listening card</title>
  <desc>The artwork group is drawn only when album artwork is available; otherwise its reserved area remains empty.</desc>
  <rect width="222" height="58" rx="5" fill="#111318" fill-opacity="0.82"/>
  <g id="conditional-album-artwork">
    <clipPath id="artwork-clip">
      <rect x="8" y="8" width="42" height="42"/>
    </clipPath>
    <g clip-path="url(#artwork-clip)">
      <rect x="8" y="8" width="42" height="42" fill="#343944"/>
      <circle cx="29" cy="29" r="15" fill="#555D6D"/>
      <circle cx="29" cy="29" r="4" fill="#111318"/>
    </g>
  </g>
  <text x="60" y="25" fill="white" font-family="sans-serif" font-size="16" font-weight="700">Music title</text>
  <text x="60" y="44" fill="#A6A8AD" font-family="sans-serif" font-size="13">Artist · Last.fm</text>
</svg>
